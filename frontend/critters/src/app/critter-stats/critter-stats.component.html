<div class="mt-60">
  <h2>Your Critters</h2>
  <ul *ngIf="critters.length">
    <li *ngFor="let critter of critters">
      <strong>{{ critter.critterName }}</strong> - Happiness: {{ critter.happiness }}
      <button>Activate</button>
    </li>
  </ul>

  <button (click)="createCritter()">Create New Critter</button>
</div>
