<!--site footer pulled from flowbite "social media icons"-->
<footer
  class="footer-custom"
>
  <!--div applies to entirety of footer content-->
  <div class="mx-auto w-full max-w-screen-xl p-4 py-6 lg:py-8">
    <div class="md:flex md:justify-between">
      <!--logo segment changed from template-->
      <div class="mb-6 md:mb-0">
        <a
          routerLink="/home"
          class="link-no-underline"
        >
          CuteComputerCritter
        </a>
      </div>
      <!--sitemap link section-->
      <div
        class="grid grid-cols-2 gap-8 font-medium sm:grid-cols-3 sm:gap-6"
      >
        <!--first column of sitemap links-->
        <div>
          <ul class="">
            <li class="mb-4">
              <a routerLink="/home" class="link">Home</a>
            </li>
            <li class="mb-4">
              <a routerLink="/how-to-play" class="link"
              >How To Play</a
              >
            </li>
            <li class="mb-4">
              <a routerLink="/support" class="link">Support</a>
            </li>
            <li class="mb-4">
              <a routerLink="/login" class="link">Account Login</a>
            </li>
            <li>
              <a
                routerLink="/overview-critters"
                class="link"
              >Overview critters</a
              >
            </li>
          </ul>
        </div>
        <!--second column of sitemap links-->
        <div>
          <ul>
            <li class="mb-4">
              <a routerLink="/about-us" class="link"
              >About Us</a
              >
            </li>
            <li class="mb-4">
              <a routerLink="/updates" class="link">Updates</a>
            </li>
            <li class="mb-4">
              <a routerLink="/privacy-policy" class="link"
              >Privacy Policy</a
              >
            </li>
            <li class="mb-4">
              <a
                routerLink="/terms-and-conditions"
                class="link"
              >Terms & Conditions
              </a>
            </li>
            <li>
              <div class="relative">
                <select
                  [(ngModel)]="selectedTheme"
                  (ngModelChange)="onThemeChange($event)"
                  class="appearance-none w-full bg-white dark:bg-purple-900 text-purple-900 dark:text-white border border-gray-300 dark:border-white rounded px-4 py-2 pr-10 text-sm font-medium">
                  <option value="dark">🌙 Dark</option>
                  <option value="light">☀️ Light</option>
                  <option value="system">🖥️ System</option>
                </select>
                <!-- Custom dropdown arrow -->
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-purple-900 dark:text-white">
                  ▼
                </div>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</footer>
