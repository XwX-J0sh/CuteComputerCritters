<div *ngIf="authService.loading$ | async; else showProfile">
  Loading...
</div>

<ng-template #showProfile>
  <div *ngIf="authService.currentUser$ | async as currentUser">
    <div class="w-full h-32 banner-color"></div>
    <div class="container">
      <header>
        <h1 class="-mt-24 page-header">Profile</h1>
        <p class="text-4xl text-purple-900 dark:text-purple-100">
          Hello, {{ currentUser.username || 'User' }}! <br>
        </p>
      </header>
      <section class="max-w-4xl ml-4 mt-12 bg-white dark:bg-purple-900 rounded-2xl p-6 shadow-lg space-y-4 text-xl text-purple-950 dark:text-purple-900">
        <h2 class="text-2xl font-semibold mb-2">Account Details</h2>
        <p><span class="font-medium">Username:</span> {{ currentUser.username }}</p>
        <p><span class="font-medium">Email:</span> {{ currentUser.email }}</p>
      </section>
      <div class="mb-16 max-w-4xl ml-4 mt-12 overflow-hidden rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700">
        <table class="w-full table-auto text-left text-gray-700 dark:text-gray-700">
          <thead class="bg-purple-100 dark:bg-violet-800 dark:text-purple-100">
          <tr>
            <th class="py-3 px-6 border-b border-gray-200 dark:border-gray-700 rounded-tl-2xl">Name</th>
            <th class="py-3 px-6 border-b border-gray-200 dark:border-gray-700 rounded-tr-2xl">Lifespan</th>
          </tr>
          </thead>
          <tbody>
          <tr
            *ngFor="let critter of deceasedCritters; let i = index"
            class="group transition-colors"
            [ngClass]="{
    'bg-yellow-100 dark:bg-yellow-500': i < 3,
    'bg-white dark:bg-purple-900': i >= 3
  }"
          >
            <td
              class="py-3 px-6 border-b border-gray-200 dark:border-gray-700 font-medium
           group-hover:bg-yellow-200 dark:group-hover:bg-yellow-600"
              *ngIf="i < 3"
            >
              {{ critter.name }}
            </td>
            <td
              class="py-3 px-6 border-b border-gray-200 dark:border-gray-700
           group-hover:bg-yellow-200 dark:group-hover:bg-yellow-600"
              *ngIf="i < 3"
            >
              {{ formatDuration(critter.lifespan) }}
            </td>

            <td
              class="py-3 px-6 border-b border-gray-200 dark:border-gray-700 font-medium
           group-hover:bg-purple-100 dark:group-hover:bg-purple-200"
              *ngIf="i >= 3"
            >
              {{ critter.name }}
            </td>
            <td
              class="py-3 px-6 border-b border-gray-200 dark:border-gray-700
           group-hover:bg-purple-100 dark:group-hover:bg-purple-200"
              *ngIf="i >= 3"
            >
              {{ formatDuration(critter.lifespan) }}
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</ng-template>
